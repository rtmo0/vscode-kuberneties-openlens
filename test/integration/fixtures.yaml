# Workloads for the integration tests (namespace openlens-smoke).
apiVersion: v1
kind: Namespace
metadata:
  name: openlens-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: openlens-smoke
  labels: {app: web}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports: [{containerPort: 80, name: http}]
          envFrom: [{configMapRef: {name: app-config}}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: openlens-smoke}
spec:
  selector: {app: web}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: web, namespace: openlens-smoke}
spec:
  rules:
    - host: web.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: web, port: {name: http}}}
---
apiVersion: v1
kind: Secret
metadata: {name: db-creds, namespace: openlens-smoke}
stringData: {username: admin, password: s3cr3t}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: app-config, namespace: openlens-smoke}
data: {LOG_LEVEL: info}
---
apiVersion: v1
kind: Pod
metadata: {name: crasher, namespace: openlens-smoke, labels: {app: crasher}}
spec:
  containers:
    - name: crash
      image: busybox:1.36
      command: [sh, -c, 'echo starting; echo boom >&2; sleep 3; exit 1']
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: ticker, namespace: openlens-smoke}
spec:
  schedule: '*/30 * * * *'
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers: [{name: tick, image: busybox:1.36, command: [sh, -c, 'echo tick; date']}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: store, namespace: openlens-smoke}
spec:
  serviceName: store
  replicas: 1
  selector: {matchLabels: {app: store}}
  template:
    metadata: {labels: {app: store}}
    spec:
      terminationGracePeriodSeconds: 1
      containers: [{name: store, image: busybox:1.36, command: [sh, -c, 'sleep 100000']}]
---
# A read-only identity for the RBAC tests.
apiVersion: v1
kind: ServiceAccount
metadata: {name: viewer, namespace: openlens-smoke}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: viewer, namespace: openlens-smoke}
subjects: [{kind: ServiceAccount, name: viewer, namespace: openlens-smoke}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
