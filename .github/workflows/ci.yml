name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Type-check and build
        run: npm run check && npm run build

      - name: Unit tests
        run: npm test

      - name: Verify VSIX packaging
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-kuberneties-openlens-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
  integration:
    name: Integration tests (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: openlens
          config: test/integration/kind.yaml

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Install metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'

      - name: Apply fixtures
        run: |
          kubectl apply -f test/integration/fixtures.yaml
          kubectl apply -f test/integration/prometheus.yaml
          kubectl -n openlens-smoke rollout status deployment/web --timeout=180s
          kubectl -n openlens-smoke rollout status statefulset/store --timeout=180s
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s
          kubectl -n monitoring rollout status deployment/prometheus --timeout=180s
          # metrics-server and Prometheus need a scrape or two before they have data.
          for i in $(seq 1 30); do kubectl top pods -n openlens-smoke && break; sleep 5; done

      - name: Run integration tests
        env:
          OPENLENS_TEST_CONTEXT: kind-openlens
          OPENLENS_TEST_DESTRUCTIVE: '1'
          OPENLENS_TEST_PROMETHEUS: '1'
        run: npm run test:integration
